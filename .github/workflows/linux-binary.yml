name: Build Zen Browser (Linux)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm \
            build-essential libgtk2.0-dev libpython3-dev m4 uuid \
            libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev \
            libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev \
            libxt-dev xvfb lld llvm pkg-config curl zip g++ make

      - name: Install Rust 1.90.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.90.0
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export environment variables
        run: |
          echo "ZEN_RELEASE=1" >> $GITHUB_ENV
          echo "SURFER_PLATFORM=linux" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Update Surfer configuration
        run: npm run surfer update

      - name: Setup Surfer CI
        run: npm run surfer -- ci --brand release --display-version 1.0a

      - name: Download language packs
        run: sh scripts/download-language-packs.sh

      - name: Initialize (download, import, bootstrap)
        run: npm run init

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Rename artifact
        run: mv dist/zen-1.0a.en-US.linux-x86_64.tar.xz zen.linux-x86_64.tar.xz

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v1.0a
          release_name: Zen Browser v1.0a
          body: |
            Automated Linux release build for Zen Browser v1.0a
            Built and packaged by GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./zen.linux-x86_64.tar.xz
          asset_name: zen.linux-x86_64.tar.xz
          asset_content_type: application/x-xz
